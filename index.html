<meta name="description" content="เช็กคิวว่างอาบน้ำ-ตัดขนสัตว์เลี้ยงแบบเรียลไทม์ แล้วทักไลน์จองคิวกับ Champion Petshop">

<style>
/* ============ Design tokens (Champion Petshop brand) ============ */
:root{
  --forest-950:#1B261E;--forest-900:#23301F;--forest-800:#2F4436;--forest-700:#3E5A47;--forest-600:#4A6853;--forest-500:#55765E;--forest-400:#6F8C77;--forest-300:#8FA895;--forest-200:#BACCBF;--forest-100:#DCE6DE;--forest-50:#EEF3EF;
  --sage-700:#5E7C60;--sage-600:#77987A;--sage-500:#96B297;--sage-400:#A9C1AA;--sage-300:#C0D2C1;--sage-200:#D6E2D7;--sage-100:#E8EFE8;--sage-50:#F3F7F3;
  --fawn-800:#7E5B31;--fawn-700:#A07446;--fawn-600:#B4885A;--fawn-500:#C49A6C;--fawn-400:#D2AE86;--fawn-300:#E0C6A7;--fawn-200:#EDDCC7;--fawn-100:#F6EDE1;--fawn-50:#FBF6EF;
  --bone-500:#D9D7D2;--bone-400:#E4E2DE;--bone-300:#EFEEEC;--bone-200:#F5F4F2;--bone-100:#FAFAF9;--white:#FFFFFF;
  --ink-900:#1C1B19;--ink-800:#2C2A27;--ink-700:#403D38;--ink-600:#5A5650;--ink-500:#78736B;--ink-400:#9A948B;--ink-300:#BEB9B1;
  --success-600:#3E7A52;--success-500:#4C9364;--success-100:#E1F0E6;
  --warning-600:#B07C1E;--warning-500:#D9A441;--warning-100:#FBEFD6;
  --danger-600:#A2432F;--danger-500:#C0553F;--danger-100:#F8E4DE;
  --info-600:#3A6B78;--info-500:#4C8797;--info-100:#E0EFF2;

  --surface-page:var(--bone-300);--surface-card:var(--white);--surface-sunken:var(--bone-400);--surface-brand:var(--forest-500);--surface-brand-soft:var(--sage-100);--surface-accent-soft:var(--fawn-100);
  --text-body:var(--ink-800);--text-heading:var(--ink-900);--text-muted:var(--ink-500);--text-subtle:var(--ink-400);--text-on-brand:var(--white);--text-brand:var(--forest-600);--text-link:var(--forest-600);
  --border-subtle:var(--bone-400);--border-default:var(--bone-500);--border-strong:var(--ink-300);--border-brand:var(--forest-500);

  --font-display:"Kanit","Nunito Sans",system-ui,-apple-system,sans-serif;--font-text:"Kanit","Nunito Sans",system-ui,-apple-system,sans-serif;

  --radius-xs:6px;--radius-sm:10px;--radius-md:14px;--radius-lg:20px;--radius-xl:28px;--radius-pill:999px;--radius-circle:50%;
  --space-3:8px;--space-4:12px;--space-5:16px;--space-6:20px;--space-7:24px;

  --shadow-sm:0 2px 6px rgba(27,38,30,.07);
  --shadow-md:0 8px 20px -6px rgba(27,38,30,.12);
  --shadow-lg:0 20px 44px -16px rgba(27,38,30,.18);

  --dur-fast:140ms;--ease-out:cubic-bezier(.22,.75,.25,1);
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--surface-page);color:var(--text-body);font-family:var(--font-text);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--font-display);color:var(--text-heading);font-weight:800;letter-spacing:-0.01em;margin:0}
p{margin:0}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:15px}
::selection{background:var(--sage-300);color:var(--ink-900)}
@keyframes cpPulse{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes cpRise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes cpSpin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

.cp-app{min-height:100vh;display:flex;justify-content:center;background:var(--surface-page)}
.cp-shell{width:100%;max-width:480px;min-height:100vh;background:var(--surface-page);display:flex;flex-direction:column;position:relative}

/* header */
.cp-header{position:sticky;top:0;z-index:20;background:rgba(239,238,236,.92);backdrop-filter:saturate(140%) blur(14px);border-bottom:1px solid var(--border-subtle);padding:16px 20px 12px;display:flex;flex-direction:column;gap:10px}
.cp-header-row{display:flex;align-items:center;gap:12px}
.cp-logo{width:48px;height:48px;border-radius:50%;background:var(--sage-100);display:flex;align-items:center;justify-content:center;flex:0 0 auto;border:1.5px solid var(--border-default)}
.cp-brand{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0}
.cp-brand-name{font-family:var(--font-display);font-weight:800;font-size:20px;color:var(--text-heading);line-height:1.15}
.cp-brand-tag{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--text-brand)}
.cp-iconbtn{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--border-default);background:var(--white);display:flex;align-items:center;justify-content:center;color:var(--ink-700);transition:transform var(--dur-fast) var(--ease-out),background var(--dur-fast) var(--ease-out);flex:0 0 auto}
.cp-iconbtn:hover{background:var(--sage-50)}
.cp-iconbtn:active{transform:scale(.92)}
.cp-iconbtn.spinning svg{animation:cpSpin .8s linear infinite}
.cp-meta-row{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--text-muted)}
.cp-mock-badge{font-size:11px;font-weight:700;color:var(--warning-600);background:var(--warning-100);display:inline-flex;padding:3px 10px;border-radius:999px;width:fit-content}

/* card */
.cp-card{background:var(--white);border-radius:var(--radius-lg);padding:14px 16px}
.cp-card.tone-sage{background:var(--sage-100)}
.cp-card.tone-fawn{background:var(--fawn-100)}
.cp-card.tone-plain{border:1px solid var(--border-subtle);box-shadow:var(--shadow-sm)}
.cp-info-row{display:flex;gap:10px;align-items:flex-start;font-size:13px;line-height:1.55}

/* date pills */
.cp-daylist{display:flex;gap:10px;overflow-x:auto;padding:2px 20px 8px}
.cp-day{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-width:56px;height:68px;padding:0 6px;border-radius:var(--radius-lg);flex:0 0 auto;border:1.5px solid var(--border-default);background:var(--white);color:var(--ink-800);transition:var(--dur-fast) var(--ease-out)}
.cp-day.today{border-color:var(--forest-500);color:var(--forest-700)}
.cp-day.selected{background:var(--forest-500);border-color:var(--forest-500);color:var(--white);box-shadow:var(--shadow-sm)}
.cp-day .wd{font-size:12px;font-weight:700}
.cp-day .num{font-family:var(--font-display);font-size:18px;font-weight:800}
.cp-day .tag{font-size:10px;font-weight:700;opacity:.85}

/* legend */
.cp-legend{display:flex;gap:14px;flex-wrap:wrap;padding:0 20px}
.cp-legend-item{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text-muted)}
.cp-swatch{width:12px;height:12px;border-radius:3px}

/* grid */
.cp-scroll-hint{display:flex;align-items:center;gap:5px;padding:0 20px;font-size:11.5px;font-weight:600;color:var(--text-muted)}
.cp-scroll-hint svg{flex:0 0 auto;width:14px;height:14px}
.cp-gridwrap-outer{position:relative}
.cp-gridwrap-outer::after{content:'';position:absolute;top:0;right:0;bottom:8px;width:32px;background:linear-gradient(to right, transparent, var(--surface-page) 65%);pointer-events:none}
.cp-gridwrap{overflow-x:auto;padding:4px 20px 8px}
.cp-grid{display:flex;flex-direction:column;gap:3px;width:fit-content}
.cp-grid-row{display:flex;gap:3px}
.cp-rowlabel{width:82px;flex:0 0 82px;position:sticky;left:0;z-index:1;background:var(--white);border:1px solid var(--border-subtle);border-radius:var(--radius-xs);display:flex;align-items:center;padding:0 8px;font-size:12px;font-weight:700;color:var(--ink-800)}
.cp-collabel{width:44px;flex:0 0 44px;text-align:center;font-size:10px;color:var(--text-muted);padding:0 0 4px}
.cp-cell{width:44px;flex:0 0 44px;height:38px;border-radius:var(--radius-xs);background:var(--white);border:1.5px solid var(--border-default)}
.cp-cell.booked{background:var(--danger-500);border-color:var(--danger-500)}
.cp-cell.closed{background:var(--ink-300);border-color:var(--ink-300)}
.cp-cell.past{background:var(--ink-300);border-color:var(--ink-300);opacity:.6}
.cp-corner{width:82px;flex:0 0 82px;position:sticky;left:0;background:var(--surface-page)}

/* buttons */
.cp-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 18px;border-radius:999px;font-weight:700;font-size:14.5px;border:1.5px solid transparent;transition:var(--dur-fast) var(--ease-out);text-decoration:none}
.cp-btn.lg{height:54px;font-size:15.5px}
.cp-btn.full{width:100%}
.cp-btn.primary{background:var(--forest-500);color:var(--white)}
.cp-btn.primary:hover{background:var(--forest-600)}
.cp-btn.secondary{background:var(--white);color:var(--forest-700);border-color:var(--border-default)}
.cp-btn.secondary:hover{background:var(--sage-50)}
.cp-btn:active{transform:scale(.97)}

/* sticky footer */
.cp-footer{position:sticky;bottom:0;width:100%;background:rgba(250,250,249,.97);backdrop-filter:blur(14px) saturate(140%);border-top:1px solid var(--border-subtle);padding:14px 20px calc(14px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px;z-index:30;box-shadow:var(--shadow-lg);margin-top:auto}
.cp-footer-note{font-size:11.5px;line-height:1.5;color:var(--text-muted)}
.cp-footer-row{display:flex;gap:10px}

/* skeleton / empty / error */
.cp-skel{height:42px;border-radius:6px;background:var(--bone-400);animation:cpPulse 1.2s ease-in-out infinite}
.cp-emptystate{display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;padding:40px 24px}
.cp-emptystate-icon{width:52px;height:52px;border-radius:50%;background:var(--danger-100);display:flex;align-items:center;justify-content:center;color:var(--danger-600)}
.cp-fadein{animation:cpRise .25s var(--ease-out)}
</style>
</head>
<body>
<div class="cp-app">
  <div class="cp-shell" id="app"></div>
</div>

<script>
/* ==========================================================================
   Champion Petshop — เว็บแอพเช็กคิวว่างแบบเรียลไทม์ (ดูอย่างเดียว)
   ลูกค้าดูคิวว่างได้เท่านั้น การจอง/ยกเลิก/เปลี่ยนเวลาทำโดยเจ้าหน้าที่ผ่านหน้าเจ้าหน้าที่เท่านั้น
   (ลูกค้าทักแชท LINE ของร้านเพื่อจองคิว)

   วิธีเชื่อมกับ Google Sheet จริง:
   1. ตั้งค่า Google Sheet + Apps Script ตามคู่มือ (ไฟล์ Code.gs)
   2. คัดลอก URL ที่ได้จาก Deploy > Web app (ลงท้ายด้วย /exec)
   3. วางแทนค่าว่างด้านล่างนี้
   ถ้าเว้นว่างไว้ แอพจะโชว์ "ข้อมูลจำลอง" ให้พรีวิวได้โดยไม่ต้องต่อ Sheet
   ========================================================================== */
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzIoxyPC9tX9dJrymqOUwM6l_BzEv79gZXqyIAtCE-fZIt69hb7UEFlimmSOAbf0W61Ig/exec'; // <-- วาง URL ของ Apps Script Web App (/exec) ตรงนี้
const AUTO_REFRESH_MS = 45000; // รีเฟรชคิวอัตโนมัติทุกกี่มิลลิวินาที (เพื่อความเป็นเรียลไทม์)

const FALLBACK = {
  shopName: 'Champion Petshop',
  tagline: 'เช็กคิวว่างอาบน้ำ-ตัดขน',
  hoursText: '10:00–20:00 น. ทุกวัน',
  lineOaId: '@413utlzb',
  openTime: '10:00',
  closeTime: '20:00',
  slotMinutes: 30,
  staffList: ['ช่างพิมพ์', 'พี่ใหม่', 'เต้น', 'ว่ายน้ำ'],
  daysAhead: 10
};

const ICONS = {
  paw: '<svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="7.5" cy="8" r="2.2"/><circle cx="12" cy="5.5" r="2.2"/><circle cx="16.5" cy="8" r="2.2"/><circle cx="19" cy="12.5" r="2"/><path d="M12 12c-3 0-6.5 2.2-6.5 5.6C5.5 20 7.3 21 9 20.2c1-.5 2-.7 3-.7s2 .2 3 .7c1.7.8 3.5-.2 3.5-2.6C18.5 14.2 15 12 12 12Z"/></svg>',
  refresh: '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-2.3 5.6"/><path d="M20 5v6h-6"/></svg>',
  shield: '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6l7-3Z"/><path d="M9 12l2 2 4-4"/></svg>',
  calendar: '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
  x: '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  arrowRight: '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>'
};

/* ---------------------------------------------------------------- state */
const state = {
  loading: true,
  error: false,
  schedule: null,
  isMock: true,
  lastUpdated: null,
  selectedDayIndex: 0
};

/* ---------------------------------------------------------------- data */
function loadSchedule(background) {
  if (!background) { state.loading = true; state.error = false; render(); }
  if (APPS_SCRIPT_URL) {
    fetch(APPS_SCRIPT_URL + '?action=schedule')
      .then(r => r.json())
      .then(json => {
        if (json.error) throw new Error(json.error);
        state.schedule = json;
        state.isMock = false;
        state.loading = false; state.error = false;
        state.lastUpdated = new Date();
        render();
      })
      .catch(() => { state.loading = false; state.error = true; render(); });
  } else {
    setTimeout(() => {
      state.schedule = generateMockSchedule();
      state.isMock = true;
      state.loading = false; state.error = false;
      state.lastUpdated = new Date();
      render();
    }, background ? 300 : 600);
  }
}

function generateMockSchedule() {
  const { openTime, closeTime, slotMinutes, staffList, daysAhead, shopName, tagline, hoursText, lineOaId } = FALLBACK;
  const openMinutes = timeToMinutes(openTime), closeMinutes = timeToMinutes(closeTime);
  const totalSlots = Math.round((closeMinutes - openMinutes) / slotMinutes);
  const seed = Math.floor(Date.now() / 60000);
  const days = [];
  const now = new Date();
  for (let d = 0; d < daysAhead; d++) {
    const date = new Date(now.getFullYear(), now.getMonth(), now.getDate() + d);
    const dateStr = formatDateYMD(date);
    const bookedMap = {};
    staffList.forEach((name, sIdx) => {
      const arr = new Array(totalSlots).fill(false);
      let idx = 0, step = 0;
      const rnd = () => { step += 1; return seededRandom(seed + d * 5003 + sIdx * 733 + step * 97); };
      while (idx < totalSlots) {
        idx += Math.floor(rnd() * 3);
        if (idx >= totalSlots) break;
        const w = rnd();
        const length = w < 0.6 ? (3 + Math.floor(rnd() * 3)) : w < 0.85 ? (1 + Math.floor(rnd() * 2)) : (6 + Math.floor(rnd() * 3));
        for (let k = idx; k < Math.min(totalSlots, idx + length); k++) arr[k] = true;
        idx += length;
      }
      bookedMap[name] = arr;
    });
    const slots = [];
    for (let i = 0; i < totalSlots; i++) {
      const staffObj = {};
      staffList.forEach(name => { staffObj[name] = bookedMap[name][i] ? 'booked' : null; });
      slots.push({ start: minutesToTime(openMinutes + i * slotMinutes), staff: staffObj });
    }
    days.push({ date: dateStr, slots });
  }
  return { shopName, tagline, hoursText, lineOaId, openTime, closeTime, slotMinutes, staffList, days, generatedAt: new Date().toISOString() };
}

function seededRandom(seed) { const x = Math.sin(seed) * 10000; return x - Math.floor(x); }

/* ---------------------------------------------------------------- helpers */
function timeToMinutes(t) { const p = String(t).split(':'); return Number(p[0]) * 60 + Number(p[1] || 0); }
function minutesToTime(m) { const h = Math.floor(m / 60), mm = m % 60; return String(h).padStart(2, '0') + ':' + String(mm).padStart(2, '0'); }
function formatDateYMD(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function parseYMD(s) { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); }
function weekdayShort(d) { return ['อา', 'จ', 'อ', 'พ', 'พฤ', 'ศ', 'ส'][d.getDay()]; }
function monthsFull() { return ['มกราคม', 'กุมภาพันธ์', 'มีนาคม', 'เมษายน', 'พฤษภาคม', 'มิถุนายน', 'กรกฎาคม', 'สิงหาคม', 'กันยายน', 'ตุลาคม', 'พฤศจิกายน', 'ธันวาคม']; }
function dateFull(d) {
  const weekdays = ['อาทิตย์', 'จันทร์', 'อังคาร', 'พุธ', 'พฤหัสบดี', 'ศุกร์', 'เสาร์'];
  return 'วัน' + weekdays[d.getDay()] + 'ที่ ' + d.getDate() + ' ' + monthsFull()[d.getMonth()] + ' ' + (d.getFullYear() + 543);
}
function isSameDate(a, b) { return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate(); }
function escapeHtml(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

/* ---------------------------------------------------------------- render root */
function render() {
  const app = document.getElementById('app');
  app.innerHTML = renderHeader() + renderMain() + renderFooter();
  bindEvents();
  scrollGridToNow();
}

/* เลื่อนตารางคิวไปที่ช่วงเวลาปัจจุบันอัตโนมัติ (เฉพาะตอนดูวันนี้) เพื่อไม่ต้องเลื่อนเอง */
function scrollGridToNow() {
  if (state.loading || state.error || !state.schedule) return;
  const days = state.schedule.days;
  const day = days && days[state.selectedDayIndex];
  if (!day || !day.slots || !day.slots.length) return;
  const now = new Date();
  const dayDate = parseYMD(day.date);
  if (!isSameDate(dayDate, now)) return;
  const wrap = document.querySelector('.cp-gridwrap');
  if (!wrap) return;
  const colLabels = wrap.querySelectorAll('.cp-collabel');
  if (!colLabels.length) return;
  const nowMinutes = now.getHours() * 60 + now.getMinutes();
  let targetIdx = -1;
  for (let i = 0; i < day.slots.length; i++) {
    if (timeToMinutes(day.slots[i].start) <= nowMinutes) targetIdx = i; else break;
  }
  if (targetIdx < 0) return; // ยังไม่ถึงเวลาเปิดร้าน โชว์จากช่วงแรกตามปกติ
  targetIdx = Math.max(0, targetIdx - 1); // เผื่อเห็นช่วงก่อนหน้าปัจจุบันไว้นิดหน่อยเป็นบริบท
  const targetEl = colLabels[targetIdx];
  const corner = wrap.querySelector('.cp-corner');
  if (!targetEl) return;
  const offset = targetEl.offsetLeft - (corner ? corner.offsetWidth : 0);
  wrap.scrollLeft = Math.max(0, offset);
}

function brand() { return state.schedule || FALLBACK; }

function renderHeader() {
  const b = brand();
  const lastText = state.lastUpdated ? 'อัปเดตล่าสุด ' + String(state.lastUpdated.getHours()).padStart(2, '0') + ':' + String(state.lastUpdated.getMinutes()).padStart(2, '0') + ' น.' : ' ';
  return `
  <div class="cp-header">
    <div class="cp-header-row">
      <div class="cp-logo">${ICONS.paw}</div>
      <div class="cp-brand">
        <div class="cp-brand-name">${escapeHtml(b.shopName)}</div>
        <div class="cp-brand-tag">${escapeHtml(b.tagline || FALLBACK.tagline)}</div>
      </div>
      <button class="cp-iconbtn ${state.loading ? 'spinning' : ''}" id="btn-refresh" aria-label="รีเฟรชคิว">${ICONS.refresh}</button>
    </div>
    <div class="cp-meta-row">
      <span>${lastText}</span>
      <span>เปิด ${escapeHtml(b.hoursText || FALLBACK.hoursText)}</span>
    </div>
    ${state.isMock && !state.loading ? `<div class="cp-mock-badge">ตัวอย่างข้อมูลจำลอง — ยังไม่เชื่อมต่อ Google Sheet</div>` : ''}
  </div>`;
}

function renderMain() {
  if (state.error) return renderErrorState();
  if (state.loading || !state.schedule) return renderLoadingState();
  return renderScheduleView();
}

function renderErrorState() {
  return `
  <div class="cp-emptystate">
    <div class="cp-emptystate-icon">${ICONS.x}</div>
    <div style="font-family:var(--font-display);font-weight:800;font-size:16px;">โหลดข้อมูลคิวไม่สำเร็จ</div>
    <div style="font-size:13px;color:var(--text-muted);">เชื่อมต่อกับตารางคิวของร้านไม่สำเร็จ ลองใหม่อีกครั้ง</div>
    <button class="cp-btn secondary" id="btn-retry">ลองใหม่อีกครั้ง</button>
  </div>`;
}

function renderLoadingState() {
  return `<div style="padding:16px 20px 24px;display:flex;flex-direction:column;gap:6px;">
    ${[1,2,3,4].map(() => `<div class="cp-skel"></div>`).join('')}
  </div>`;
}

/* ---------------------------------------------------------------- schedule view (read-only) */
function renderScheduleView() {
  const sc = state.schedule;
  const days = sc.days;
  const now = new Date();
  if (state.selectedDayIndex >= days.length) state.selectedDayIndex = 0;
  const day = days[state.selectedDayIndex];
  const dayDate = parseYMD(day.date);

  let totalAvailable = 0;
  const rows = sc.staffList.map(name => {
    const cells = day.slots.map(s => {
      const nowMinutes = now.getHours() * 60 + now.getMinutes();
      const isPast = isSameDate(dayDate, now) && timeToMinutes(s.start) <= nowMinutes;
      const raw = s.staff[name];
      let status = isPast ? 'past' : (raw === 'closed' ? 'closed' : (raw === 'booked' ? 'booked' : 'available'));
      if (status === 'available') totalAvailable++;
      const label = status === 'available' ? 'ว่าง' : status === 'booked' ? 'ไม่ว่าง' : status === 'closed' ? 'หยุด' : 'ผ่านไปแล้ว';
      const cls = status === 'available' ? '' : status;
      return `<button class="cp-cell ${cls}" disabled tabindex="-1" title="${name} ${s.start} — ${label}"></button>`;
    }).join('');
    return `<div class="cp-grid-row"><div class="cp-rowlabel">${escapeHtml(name)}</div>${cells}</div>`;
  }).join('');

  const cols = day.slots.map(s => `<div class="cp-collabel" style="font-weight:${s.start.endsWith(':00') ? '800' : '500'}">${s.start}</div>`).join('');

  return `
  <div style="padding:16px 20px 0;">
    <div class="cp-card tone-sage">
      <div class="cp-info-row">${ICONS.shield}<div>ดูคิวว่างแบบเรียลไทม์ได้ที่นี่ — หากต้องการจองคิว ทักแชท LINE ของร้านด้านล่างได้เลย</div></div>
    </div>
  </div>
  <div style="padding:18px 0 4px;display:flex;flex-direction:column;gap:10px;">
    <div style="padding:0 20px;font-family:var(--font-display);font-weight:800;font-size:15px;">เลือกวันที่</div>
    <div class="cp-daylist">${renderDayPills(days, state.selectedDayIndex)}</div>
  </div>
  <div style="padding:0 20px 4px;font-size:13px;font-weight:600;color:var(--text-muted);">${dateFull(dayDate)}</div>
  <div style="display:flex;flex-direction:column;gap:12px;padding:8px 0 24px;">
    ${totalAvailable === 0 ? `<div style="padding:0 20px;"><div class="cp-card tone-fawn"><div class="cp-info-row">${ICONS.calendar}<div>วันนี้คิวเต็มทุกช่วงเวลาแล้ว ลองเลือกวันถัดไป</div></div></div></div>` : ''}
    <div style="padding:0 20px;font-size:12.5px;font-weight:600;color:var(--text-muted);">ว่างทั้งหมด ${totalAvailable} ช่วงเวลา</div>
    <div class="cp-legend">
      <div class="cp-legend-item"><div class="cp-swatch" style="background:var(--white);border:1.5px solid var(--border-default);"></div>ว่าง</div>
      <div class="cp-legend-item"><div class="cp-swatch" style="background:var(--danger-500);"></div>ไม่ว่าง</div>
      <div class="cp-legend-item"><div class="cp-swatch" style="background:var(--ink-300);"></div>หยุด/ผ่านไปแล้ว</div>
    </div>
    <div class="cp-scroll-hint">เลื่อนดูช่วงเวลาอื่นได้ ${ICONS.arrowRight}</div>
    <div class="cp-gridwrap-outer">
      <div class="cp-gridwrap">
        <div class="cp-grid">
          <div class="cp-grid-row"><div class="cp-corner"></div>${cols}</div>
          ${rows}
        </div>
      </div>
    </div>
  </div>`;
}

function renderDayPills(days, selectedIndex) {
  const now = new Date();
  return days.map((day, i) => {
    const d = parseYMD(day.date);
    const isToday = isSameDate(d, now);
    const cls = ['cp-day'];
    if (i === selectedIndex) cls.push('selected'); else if (isToday) cls.push('today');
    return `<button class="${cls.join(' ')}" data-action="select-day" data-index="${i}">
      <div class="wd">${weekdayShort(d)}</div>
      <div class="num">${d.getDate()}</div>
      ${isToday ? `<div class="tag">วันนี้</div>` : ''}
    </button>`;
  }).join('');
}

/* ---------------------------------------------------------------- footer (always LINE CTA) */
function renderFooter() {
  if (state.error || state.loading) return '';
  return `
  <div class="cp-footer">
    <div class="cp-footer-note">ต้องการจองคิว ทักแชท LINE ของร้านได้เลย เจ้าหน้าที่จะยืนยันคิวให้ทันที</div>
    <button class="cp-btn primary full lg" id="btn-line">สอบถาม/จองคิวผ่าน LINE ${ICONS.arrowRight}</button>
  </div>`;
}

/* ---------------------------------------------------------------- events */
function bindEvents() {
  const app = document.getElementById('app');

  const refreshBtn = document.getElementById('btn-refresh');
  if (refreshBtn) refreshBtn.onclick = () => loadSchedule(false);

  const retryBtn = document.getElementById('btn-retry');
  if (retryBtn) retryBtn.onclick = () => loadSchedule(false);

  app.querySelectorAll('[data-action="select-day"]').forEach(el => {
    el.onclick = () => { state.selectedDayIndex = Number(el.getAttribute('data-index')); render(); };
  });

  const lineBtn = document.getElementById('btn-line');
  if (lineBtn) lineBtn.onclick = openLine;
}

function openLine() {
  const b = brand();
  const url = 'https://line.me/R/ti/p/' + encodeURIComponent(b.lineOaId || FALLBACK.lineOaId);
  window.open(url, '_blank', 'noopener');
}

/* ---------------------------------------------------------------- init */
loadSchedule(false);
setInterval(() => loadSchedule(true), AUTO_REFRESH_MS);
</script>
</body>
</html>
